# 正式环境：必须显式提供数据库；Flyway仅执行未应用迁移，绝不drop已有数据库。
server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/study_room_reserve?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:study_room}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
app:
  booking-days: 7
  demo-seed: ${DEMO_SEED:false}
  # 默认仅本机开发；prod覆盖为已授权HTTPS网站，来源用逗号分隔。
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
