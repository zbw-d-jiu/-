# 放在现有宝塔HTTPS server内部，替换原location /和冲突的缓存/代理规则。
# 保留站点既有SSL、证书续期验证及强制HTTPS设置；本片段不含HTTP跳转。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# 精确/api也交给后端，绝不能把API错误回退成Vue首页。
location = /api {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
}

# ^~使/api/优先于宝塔可能已有的.js/.css等正则；不加尾斜杠，保留/api前缀及原查询参数。
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
}

# HTML不长期缓存，避免发布新版本后继续引用已移除的旧hash资源。
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
}

# Vite生成的hash资源长期缓存；缺少文件应404，不能返回HTML造成脚本MIME错误。
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# history深链接和刷新统一回退Vue入口，API由更优先的location处理。
location / {
    try_files $uri $uri/ /index.html;
}
