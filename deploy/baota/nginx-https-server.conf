# 完整HTTPS server参考：用于现有宝塔站点的443部分，80强制HTTPS/ACME部分保持原样。
# 以下根目录与证书路径按宝塔常用默认值；部署前核对现有站点实际路径，保留有效证书。
server {
    listen 443 ssl;
    server_name www.zhangbowen666.cn;
    root /www/wwwroot/www.zhangbowen666.cn;
    index index.html;
    charset utf-8;
    ssl_certificate /www/server/panel/vhost/cert/www.zhangbowen666.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.zhangbowen666.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:StudyRoomTLS:10m;
    ssl_session_timeout 1d;
    access_log /www/wwwlogs/study-room.access.log;
    error_log /www/wwwlogs/study-room.error.log warn;
    # 证书续期的现有宝塔include/验证location应继续保留，不用本参考替换整个站点文件。
# 放在现有宝塔HTTPS server内部，替换原location /和冲突的缓存/代理规则。
# 保留站点既有SSL、证书续期验证及强制HTTPS设置；本片段不含HTTP跳转。
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# 精确/api也交给后端，绝不能把API错误回退成Vue首页。
location = /api {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
}

# ^~使/api/优先于宝塔可能已有的.js/.css等正则；不加尾斜杠，保留/api前缀及原查询参数。
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_cache off;
    proxy_intercept_errors off;
}

# HTML不长期缓存，避免发布新版本后继续引用已移除的旧hash资源。
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
}

# Vite生成的hash资源长期缓存；缺少文件应404，不能返回HTML造成脚本MIME错误。
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# history深链接和刷新统一回退Vue入口，API由更优先的location处理。
location / {
    try_files $uri $uri/ /index.html;
}

}
